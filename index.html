<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>持ち物チェック</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 16px;
      background: #fafafa;
    }
    h1 {
      font-size: 20px;
    }
    label {
      display: block;
      padding: 12px;
      margin: 8px 0;
      background: white;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    input[type="text"] {
      width: 70%;
      padding: 8px;
      margin-right: 8px;
    }
    button {
      padding: 8px 12px;
    }
  </style>
</head>
<body>

<h1>外出チェック</h1>

<div id="list">
  <label><input type="checkbox"> 財布</label>
  <label><input type="checkbox"> スマホ</label>
  <label><input type="checkbox"> 鍵</label>
  <label><input type="checkbox"> ハンカチ</label>
  <label><input type="checkbox"> ティッシュ</label>
  <label><input type="checkbox"> ヒップシート</label>
  <label><input type="checkbox"> おむつ 3つ</label>
  <label><input type="checkbox"> 着替え</label>
  <label><input type="checkbox"> ウェットティッシュ</label>
  <label><input type="checkbox"> ビニル袋</label>
  <label><input type="checkbox"> 帽子</label>
  <label><input type="checkbox"> 日焼け止め</label>
  <label><input type="checkbox"> 虫除け</label>
  <label><input type="checkbox"> 水筒</label>
  <label><input type="checkbox"> エプロン</label>
  <label><input type="checkbox"> スプーン&フォーク</label>
  <label><input type="checkbox"> お皿</label>
  <label><input type="checkbox"> バナナ</label>
  <label><input type="checkbox"> ヨーグルト</label>
  <label><input type="checkbox"> チーズ</label>
  <label><input type="checkbox"> 保冷剤</label>
  <label><input type="checkbox"> 暇つぶし用おもちゃ</label>
</div>

<h2>項目を追加</h2>

<input type="text" id="newItem" placeholder="例：充電器">
<button onclick="addItem()">追加</button>

<p style="margin-top:20px; font-size:12px; color:#666;">
このページは「忘れ物を減らすため」に作りました。<br>
自由に使ってください。<br>
【⚠️注意】ページを更新するとチェックや追加した項目は削除されます。
</p>

<script>
function addItem() {
  const input = document.getElementById("newItem");
  const text = input.value.trim();

  if (text === "") return;

  const label = document.createElement("label");
  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";

  label.appendChild(checkbox);
  label.appendChild(document.createTextNode(" " + text));

  document.getElementById("list").appendChild(label);

  input.value = "";
}
</script>

</body>
</html>
